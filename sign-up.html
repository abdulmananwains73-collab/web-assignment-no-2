<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Manan | Sign Up</title><link rel="icon" href="manan.jpg" type="image/jpeg"><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">
<header class="shrink-0"><nav class="bg-gray-950 text-white" aria-label="Main navigation"><div class="max-w-6xl mx-auto px-6 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-4"><a href="index.html" class="text-2xl font-bold">Manan</a><div class="flex flex-wrap gap-4 text-sm"><a href="index.html" class="hover:text-blue-400">Home</a><a href="about.html" class="hover:text-blue-400">About</a><a href="contact.html" class="hover:text-blue-400">Contact</a><a href="sign-in.html" class="hover:text-blue-400">Sign In</a><a href="sign-up.html" class="text-blue-400 font-semibold">Sign Up</a></div></div></nav></header>
<main class="flex-1 flex items-center justify-center px-6 py-16"><section class="w-full max-w-md" aria-labelledby="page-title"><header class="text-center mb-8"><span class="inline-block bg-blue-100 text-blue-600 px-4 py-2 rounded-full text-sm mb-4">Join Manan</span><h1 id="page-title" class="text-3xl font-bold mb-3">Create Your Account</h1><p class="text-gray-600">Sign up to get started with Manan.</p></header><article class="bg-white rounded-2xl shadow-lg p-8"><form id="signUpForm" novalidate><div class="mb-5"><label for="name" class="block font-medium mb-2">Full Name</label><input id="name" name="name" type="text" autocomplete="name" required placeholder="Enter your full name" class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"></div><div class="mb-5"><label for="email" class="block font-medium mb-2">Email Address</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="Enter your email" class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"></div><div class="mb-5"><label for="password" class="block font-medium mb-2">Password</label><div class="relative"><input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required placeholder="Create a password" class="w-full border border-gray-300 rounded-lg px-4 py-3 pr-20 focus:outline-none focus:ring-2 focus:ring-blue-500"><button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-sm font-semibold text-blue-600">Show</button></div></div><div class="mb-6"><label for="confirmPassword" class="block font-medium mb-2">Confirm Password</label><div class="relative"><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required placeholder="Confirm your password" class="w-full border border-gray-300 rounded-lg px-4 py-3 pr-20 focus:outline-none focus:ring-2 focus:ring-blue-500"><button type="button" id="toggleConfirm" class="absolute right-3 top-1/2 -translate-y-1/2 text-sm font-semibold text-blue-600">Show</button></div></div><button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700">Create Account</button><p id="signUpMessage" class="hidden mt-4 rounded-lg bg-green-50 text-green-700 p-3 text-sm" role="status"></p></form></article><aside class="text-center mt-6 text-gray-600">Already have an account? <a href="sign-in.html" class="text-blue-600 font-semibold hover:underline">Sign In</a></aside></section></main>
<footer class="bg-black text-gray-300 py-8 text-center"><p>Simple digital experiences for everyone.</p><p class="text-sm mt-3">© 2026 Manan. All rights reserved.</p></footer>
<script>const p=document.getElementById('password'),c=document.getElementById('confirmPassword');function toggle(input,button){button.addEventListener('click',()=>{const show=input.type==='password';input.type=show?'text':'password';button.textContent=show?'Hide':'Show'})}toggle(p,document.getElementById('togglePassword'));toggle(c,document.getElementById('toggleConfirm'));const form=document.getElementById('signUpForm');form.addEventListener('submit',e=>{e.preventDefault();if(!form.checkValidity()){form.reportValidity();return;}if(p.value!==c.value){c.setCustomValidity('Passwords do not match.');c.reportValidity();return;}c.setCustomValidity('');document.getElementById('signUpMessage').textContent='Account form is valid. This demo page does not create a real account.';document.getElementById('signUpMessage').classList.remove('hidden')});c.addEventListener('input',()=>c.setCustomValidity(p.value===c.value?'':'Passwords do not match.'));</script>
</body></html>
